name: fcleaner
description: "FCleaner — A beautiful desktop GUI for cleaning Flutter build artifacts, caches, and system clutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fclean:
    path: ../../vendor/fclean
  provider: ^6.1.2
  fl_chart: ^0.70.2
  file_picker: ^8.0.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
